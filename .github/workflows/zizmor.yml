name: zizmor

# Static analysis of this repo's GitHub Actions workflows. Fails the run on any
# high-severity finding (unpinned actions, template injection, credential leaks).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/zizmor.yml']
  pull_request:
    paths: ['.github/workflows/**', '.github/zizmor.yml']

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          inputs: .github/workflows
          min-severity: high
          advanced-security: false
