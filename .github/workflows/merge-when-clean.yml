name: Merge when clean

# Merges an open PR into the default branch once it is clean on its head commit:
#   1. every check run and commit status finished green,
#   2. a real review ran on that commit: CodeRabbit "Review completed", or the
#      owner's backup review (`review-failover` = success, posted by the owner),
#   3. 0 unresolved review threads, and no merge conflicts.
# Covers only PRs that opt in: Dependabot PRs, and the owner's PRs from a
# `security/` branch or labelled `automerge`. Other PRs are left to the owner and
# to Claude sessions working under the merge-when-clean rule. Skips drafts, forks, Night Shift PRs,
# PRs labelled `needs-owner` / `do-not-merge`, and PRs that touch database rules,
# migrations, infra or this file. Owner decision 2026-10-25.
#
# A merge made with GITHUB_TOKEN does not start other workflows, so a deploy that
# runs `on: push` to the default branch will not fire after an automatic merge.
on:
  schedule:
    - cron: '23,53 * * * *'
  status: {}
  pull_request_review:
    types: [submitted]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: merge-when-clean
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when clean
    if: github.event_name != 'status' || github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Merge every clean PR
        shell: bash
        run: |
          set -uo pipefail
          base=$(gh api "repos/$REPO" --jq .default_branch)
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=$base&per_page=100" \
            --jq ".[] | select(.draft==false) | select(.head.repo.full_name==\"$REPO\")
                 | select(.user.login==\"dependabot[bot]\" or (.user.login==\"$OWNER\"
                     and ((.head.ref | startswith(\"security/\")) or any(.labels[]; .name==\"automerge\")))) | .number")
          [ -z "$prs" ] && { echo "no open PRs to check"; exit 0; }

          check_pr() {
            local pr=$1 j sha body labels files runs pending failed st bad fo cr reviewed unresolved
            j=$(gh api "repos/$REPO/pulls/$pr") || return
            sha=$(jq -r .head.sha <<<"$j")
            body=$(jq -r '.body // ""' <<<"$j")
            labels=$(jq -r '[.labels[].name] | join(",")' <<<"$j")
            case ",$labels," in *,needs-owner,*|*,do-not-merge,*) echo "#$pr: skip (label)"; return;; esac
            if grep -q 'Tatendaz/ideas-inbox#17' <<<"$body"; then echo "#$pr: skip (Night Shift PR)"; return; fi
            files=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[] | .filename, (.previous_filename // empty)')
            if grep -Eq '(^|/)(firestore\.rules|storage\.rules|database\.rules\.json)$|(^|/)migrations/|(^|/)terraform/|\.tf$|^\.github/workflows/merge-when-clean\.yml$' <<<"$files"; then
              echo "#$pr: skip (touches files the owner merges)"; return
            fi
            if [ "$(jq -r .mergeable_state <<<"$j")" = "dirty" ]; then echo "#$pr: merge conflicts"; return; fi

            runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name!="Merge when clean")] | group_by(.name) | map(max_by(.started_at))')
            pending=$(jq '[.[] | select(.status!="completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status=="completed" and ((.conclusion // "") | IN("success","neutral","skipped") | not))] | length' <<<"$runs")

            st=$(gh api "repos/$REPO/commits/$sha/statuses?per_page=100" \
              --jq 'group_by(.context) | map(sort_by(.created_at) | last)')
            bad=$(jq '[.[] | select(.context!="CodeRabbit" and .context!="review-failover") | select(.state!="success")] | length' <<<"$st")
            fo=$(jq -r '[.[] | select(.context=="review-failover")][0] | "\(.state // "none") \(.creator.login // "-")"' <<<"$st")
            cr=$(jq -r '[.[] | select(.context=="CodeRabbit")][0] | "\(.state // "none") \(.creator.login // "-") \(.description // "")"' <<<"$st")
            reviewed=no
            [ "$fo" = "success $OWNER" ] && reviewed=yes
            case "$cr" in "success coderabbitai[bot] "*"Review completed"*) reviewed=yes;; esac

            # shellcheck disable=SC2016  # GraphQL variables, not shell
            unresolved=$(gh api graphql -f query='query($o:String!,$n:String!,$pr:Int!){ repository(owner:$o,name:$n){ pullRequest(number:$pr){
                reviewThreads(first:100){ nodes{ isResolved } } } } }' -f o="${REPO%/*}" -f n="${REPO#*/}" -F pr="$pr" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length')

            echo "#$pr $sha: checks pending=$pending failed=$failed, other statuses not green=$bad, reviewed=$reviewed, unresolved threads=$unresolved"
            if [ "$pending" != 0 ] || [ "$failed" != 0 ] || [ "$bad" != 0 ] || [ "$reviewed" != yes ] || [ "$unresolved" != 0 ]; then
              echo "#$pr: not clean yet"; return
            fi
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$sha" \
              && echo "#$pr: merged" || echo "#$pr: GitHub refused the merge"
          }

          # Oldest first, so a stacked PR's base merges before the PR built on it.
          while read -r pr; do check_pr "$pr" </dev/null; done < <(sort -n <<<"$prs")
